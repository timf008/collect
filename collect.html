<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Diamond Heroes</title>
    <link rel="stylesheet" href="collect.css">
</head>

<body>

    <div class="collect-header">
    <h1>Diamond Heroes</h1>


        <h3>Log In</h3>

        <!-- 6-digit code input -->
        <input id="loginCode" placeholder="6-digit code">
        <div id="codeError" class="error"></div>

        <!-- Password input -->
        <input id="loginPassword" type="password" placeholder="Password">
        <div id="passwordError" class="error"></div>

        <!-- Buttons (IDs match your login.js exactly) -->
        <button onclick="login()">Log In</button>
        <button onclick="createAccount()">Generate Code</button>
        <button onclick="logout()">Log Out</button>


    <div class="user-info">
        <div id="tokenBalance">🪙 0</div>
        <div id="userCode">ID: ----</div>
        <div id="collectorBadge">Level: ---</div>
        <div id="levelMeter" class="level-meter"></div>
    </div>
</div>


<div class="challenge-mystery-wrapper">

    <!-- Weekly Challenge -->
    <div id="weeklyHuntBox" class="weekly-hunt">
        <h3>Weekly Challenge</h3>
        <p id="weeklyText">Loading weekly challenge...</p>

        <div class="hunt-row">
            <input id="huntAnswer" placeholder="Enter answer">
            <button onclick="submitHunt()">Submit</button>
            <div id="huntResult"></div>
        </div>
    </div>

    <!-- Mystery Chest (featured spot under Weekly Challenge) -->
    <div id="mysteryChestBox" class="mystery-chest">
        <h3>Mystery Chest</h3>
        <div id="mysteryChestContent"></div>
    </div>

    <!-- Mystery Items Grid -->
    <div id="mysteryItemsBox" class="mystery-items">
        <h3>Mystery Items</h3>
        <div id="mysteryGrid"></div>
    </div>

</div>


    <!-- Characters Section -->
<h2 class="section-title">Characters</h2>
<div id="characterGrid" class="grid"></div>

<!-- Stadiums Section -->
<h2 class="section-title">Stadiums</h2>
<div id="stadiumGrid" class="grid"></div>

<!-- Team Buses Section -->
<h2 class="section-title">Team Buses</h2>
<div id="busGrid" class="grid"></div>



    <!-- Redeem Modal -->
    <div id="redeemModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle"></h2>
            <p id="modalCost"></p>
            <button id="confirmRedeem">Redeem</button>
            <button onclick="closeModal()">Cancel</button>
        </div>
    </div>

<div id="mysteryModal" class="mystery-modal hidden">
  <div class="mystery-content">
    <h2>Mystery Item Unlocked!</h2>
    <p>You have unlocked:</p>

    <img id="mysteryImage" class="mystery-image" />

    <div id="mysteryName" class="mystery-name"></div>

    <button onclick="closeMysteryModal()">OK</button>
  </div>
</div>


    <script type="module" src="collect.js"></script>
</body>
</html>
