<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Collect</title>
    <link rel="stylesheet" href="collect.css">
</head>

<body>

    <!-- Header -->
    <div class="header">
        <h1>Collect</h1>
        <div class="user-info">
            <div id="tokenBalance">Tokens: 0</div>
            <div id="userCode">User Code: ----</div>
            <div id="collectorBadge">Level: ---</div>
        </div>
    </div>

    <!-- Characters Section -->
<h2 class="section-title">Characters</h2>
<div id="characterGrid" class="grid"></div>

<!-- Stadiums Section -->
<h2 class="section-title">Stadiums</h2>
<div id="stadiumGrid" class="grid"></div>


    <!-- Redeem Modal -->
    <div id="redeemModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle"></h2>
            <p id="modalCost"></p>
            <button id="confirmRedeem">Redeem</button>
            <button onclick="closeModal()">Cancel</button>
        </div>
    </div>

    <script src="collect.js"></script>
</body>
</html>
